services:
  titan-trains:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: titan-trains
    restart: unless-stopped
    ports:
      - "127.0.0.1:3900:80"
    environment:
      - NODE_ENV=production
    mem_limit: 32m
    cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Blueprint for optional backend sync/auth API (activate via: docker compose --profile api up -d)
  titan-api:
    profiles: ["api"]
    image: node:20-alpine
    container_name: titan-api
    restart: unless-stopped
    working_dir: /app/api
    ports:
      - "127.0.0.1:3901:3901"
    environment:
      - NODE_ENV=production
      - PORT=3901
      - APP_ORIGIN=https://titan.luluapp.com
      - ALLOWED_ORIGINS=https://titan.luluapp.com,https://localhost,http://localhost,capacitor://localhost
      - NODE_OPTIONS=--max-old-space-size=96
    mem_limit: 128m
    cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
