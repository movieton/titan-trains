server {
    listen 80;
    server_name titan.lalo-app.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # SPA routing: fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA Service Worker & Manifest: never aggressively cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed static assets: cache for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Exercise images
    location /exercises/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
