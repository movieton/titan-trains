# Soft 301 redirect from legacy domain titan.lalo-app.com to https://titan.luluapp.com
# IMPORTANT: Activate ONLY after DNS A-record for titan.luluapp.com -> 169.58.16.244
# and Let's Encrypt SSL certificate for titan.luluapp.com are verified!

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name titan.lalo-app.com;

    ssl_certificate /etc/letsencrypt/live/titan.lalo-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titan.lalo-app.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://titan.luluapp.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name titan.lalo-app.com;

    return 301 https://titan.luluapp.com$request_uri;
}
