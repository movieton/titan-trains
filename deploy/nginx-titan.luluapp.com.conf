# Host-level Nginx virtual host for https://titan.luluapp.com
# Install target: /etc/nginx/sites-available/titan.luluapp.com.conf
# After DNS A-record (titan.luluapp.com -> 169.58.16.244) propagates, run:
#   certbot --nginx -d titan.luluapp.com

limit_req_zone $binary_remote_addr zone=titan_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=titan_auth:10m rate=10r/m;

# Strict CORS origin whitelist for Web PWA and Capacitor Android/iOS APK
map $http_origin $titan_cors_origin {
    default "";
    "https://titan.luluapp.com" "https://titan.luluapp.com";
    "https://localhost" "https://localhost";
    "http://localhost" "http://localhost";
    "capacitor://localhost" "capacitor://localhost";
}

map $http_origin $titan_cors_creds {
    default "";
    "https://titan.luluapp.com" "true";
    "https://localhost" "true";
    "http://localhost" "true";
    "capacitor://localhost" "true";
}

server {
    listen 80;
    listen [::]:80;
    server_name titan.luluapp.com;

    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/titan.luluapp.access.log;
    error_log /var/log/nginx/titan.luluapp.error.log;

    # Security headers (server-level; repeated in locations that define custom add_header)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.dicebear.com https:; media-src 'self' blob: https:; connect-src 'self' https://titan.luluapp.com https://accounts.google.com https://oauth2.googleapis.com; font-src 'self' data:; worker-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    # Never cache Service Worker or PWA manifest
    location = /sw.js {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Strict rate limit for auth / OAuth endpoints
    location ^~ /api/auth/ {
        limit_req zone=titan_auth burst=10 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $titan_cors_origin always;
            add_header Access-Control-Allow-Credentials $titan_cors_creds always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary "Origin" always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $titan_cors_origin always;
        add_header Access-Control-Allow-Credentials $titan_cors_creds always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3901;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API proxy (no cache, rate limited, APK CORS enabled)
    location /api/ {
        limit_req zone=titan_api burst=20 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $titan_cors_origin always;
            add_header Access-Control-Allow-Credentials $titan_cors_creds always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary "Origin" always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $titan_cors_origin always;
        add_header Access-Control-Allow-Credentials $titan_cors_creds always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3901;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Main PWA frontend container (titan-trains)
    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
